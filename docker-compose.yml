version: "3.9"

services:
  server:
    build: .
    ports:
      - "8765:8765"
    environment:
      - NETWORK_HOST=0.0.0.0
      - NETWORK_PORT=8765
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=kfchess
      - PG_PASSWORD=kfchess
      - PG_DATABASE=kfchess
      - NATS_URL=nats://nats:4222
    depends_on:
      - postgres
      - nats

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kfchess
      - POSTGRES_PASSWORD=kfchess
      - POSTGRES_DB=kfchess
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pg_data:
